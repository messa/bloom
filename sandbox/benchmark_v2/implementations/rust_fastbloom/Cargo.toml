[package]
name = "rust_fastbloom_ngram"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust_fastbloom_ngram"
path = "src/main.rs"

[dependencies]
fastbloom = { version = "0.14", features = ["serde"] }
regex = "1"
flate2 = "1"
xz2 = "0.1"
bincode = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
